# Local dev stack: API + MongoDB.   docker compose up --build
# Secrets come from the shell / an untracked .env next to this file (see .env.example). The defaults below are DEV ONLY.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"] # one-node replica set: trades need transactions
    ports:
      - "127.0.0.1:27017:27017"   # loopback only
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set the first time, healthy once it has a primary.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }; if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development # the image defaults to production, which refuses the dev secrets below and never logs the reset link
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DB: zenonia
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-dev-only-jwt-secret-0000}
      SERVICE_KEY: ${SERVICE_KEY:-dev-only-service-key}
      ZONE_ID: ${ZONE_ID:-frost-hollow}
      ZONE_HOST: ${ZONE_HOST:-127.0.0.1}
      ZONE_PORT: ${ZONE_PORT:-9050}

volumes:
  mongo-data:
